
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kertas Kerja Manajemen Risiko 2026 — Dinas PMD Provinsi Sulawesi Tengah</title>
<style>
:root{
  --navy:#122540;
  --navy-2:#1c3a5e;
  --paper:#f6f3ec;
  --paper-2:#ffffff;
  --ink:#1b1b1b;
  --muted:#6b6f76;
  --line:#dcd6c7;
  --gold:#b6842c;
  --gold-2:#e4b356;
  --green:#3f7a4f;
  --amber:#c98a1f;
  --red:#b5442e;
  --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -14px rgba(18,37,64,.25);
  --radius:10px;
  font-family:'Source Sans Pro',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{
  font-family:'Georgia',"Source Sans Pro",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:270px;flex-shrink:0;background:var(--navy);color:#e9ecf1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .eyebrow{font-family:'Source Sans Pro',Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);font-weight:600;}
.brand h1{font-family:Georgia,serif;font-size:19px;margin:6px 0 4px;line-height:1.25;font-weight:700;}
.brand .sub{font-size:12.5px;color:#b9c2d1;}
nav.menu{padding:10px 10px 20px;flex:1;}
.menu-group{margin-top:14px;}
.menu-group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8a93a6;padding:6px 10px;font-weight:700;font-family:'Source Sans Pro',Arial,sans-serif;}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#d7dce6;
  padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-family:'Source Sans Pro',Arial,sans-serif;
}
.menu-item:hover{background:rgba(255,255,255,.06);}
.menu-item.active{background:var(--gold);color:#1a1200;font-weight:700;}
.menu-item .code{
  font-family:Georgia,serif;font-weight:700;font-size:11px;flex-shrink:0;width:26px;height:20px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);border-radius:4px;
}
.menu-item.active .code{background:rgba(0,0,0,.18);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#8a93a6;}

/* Main */
main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:5;background:var(--paper-2);border-bottom:1px solid var(--line);
  padding:14px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar .crumbs{font-size:12px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;font-family:'Source Sans Pro',Arial,sans-serif;}
.topbar h2{font-family:Georgia,serif;margin:2px 0 0;font-size:22px;}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.btn{
  font-family:'Source Sans Pro',Arial,sans-serif;font-size:13px;font-weight:600;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--navy-2);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--navy-2);}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1a1200;}
.btn-gold:hover{background:var(--gold-2);}
.btn-danger{color:var(--red);border-color:#e6c9c1;}
.btn-danger:hover{background:#fbf0ee;}
.btn-sm{padding:6px 10px;font-size:12px;}
.save-pill{font-size:11.5px;color:var(--green);font-family:'Source Sans Pro',Arial,sans-serif;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .3s;}
.save-pill.show{opacity:1;}

.content{padding:26px 34px 80px;max-width:1180px;}
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.panel h3{font-family:Georgia,serif;font-size:17px;margin:0 0 4px;}
.panel .desc{font-size:13px;color:var(--muted);margin-bottom:16px;font-family:'Source Sans Pro',Arial,sans-serif;}

/* Header info grid */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-2);font-family:'Source Sans Pro',Arial,sans-serif;}
.field .help{font-size:11.5px;color:var(--muted);font-family:'Source Sans Pro',Arial,sans-serif;margin-top:-2px;}
input[type=text],input[type=number],textarea,select{
  font-family:'Source Sans Pro',Arial,sans-serif;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:#fdfcf9;color:var(--ink);width:100%;
}
textarea{resize:vertical;min-height:38px;line-height:1.4;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold-2);outline-offset:0;border-color:var(--gold);}

/* Record cards */
.record-list{display:flex;flex-direction:column;gap:14px;}
.group-heading{
  font-family:Georgia,serif;font-size:14px;font-weight:700;color:var(--navy-2);margin:18px 0 4px;
  padding-bottom:6px;border-bottom:2px solid var(--gold-2);
}
.group-heading:first-child{margin-top:0;}
.record-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fffdf9;}
.record-card summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;
  font-family:'Source Sans Pro',Arial,sans-serif;
}
.record-card summary::-webkit-details-marker{display:none;}
.record-card summary .idx{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.record-card summary .sum{flex:1;min-width:0;}
.record-card summary .sum .title{font-size:13.5px;font-weight:600;color:var(--ink);}
.record-card summary .sum .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.record-card summary .chev{color:var(--muted);font-size:12px;margin-top:4px;transition:transform .15s;}
.record-card[open] summary .chev{transform:rotate(90deg);}
.record-card .body{padding:4px 16px 16px;border-top:1px dashed var(--line);}
.record-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:12px;}
.record-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
.add-row{display:flex;justify-content:center;margin-top:8px;}

.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:'Source Sans Pro',Arial,sans-serif;}
.badge-rendah{background:#e4f1e6;color:var(--green);}
.badge-sedang{background:#fdf0d8;color:var(--amber);}
.badge-tinggi{background:#fbe3dd;color:var(--red);}

/* Matrix view */
.matrix-wrap{overflow-x:auto;}
table.matrix{border-collapse:collapse;width:100%;font-family:'Source Sans Pro',Arial,sans-serif;font-size:12.5px;}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:8px;vertical-align:top;}
table.matrix th{background:var(--navy);color:#fff;font-weight:600;text-align:center;}
table.matrix td.axis{background:#eef1f6;font-weight:700;text-align:center;color:var(--navy-2);}
table.matrix td.cell{min-height:60px;}
.chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin:2px 3px 0 0;font-size:11px;}
.cell.lvl-rendah{background:#eef8ef;}
.cell.lvl-sedang{background:#fdf6e6;}
.cell.lvl-tinggi{background:#fbeae5;}
.cell.lvl-sangattinggi{background:#f7d9d0;}

.fgd-table-wrap{overflow-x:auto;}
table.fgd{border-collapse:collapse;font-size:11.5px;font-family:'Source Sans Pro',Arial,sans-serif;}
table.fgd th,table.fgd td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap;}
table.fgd th{background:var(--navy);color:#fff;font-weight:600;}
table.fgd td.name-col{text-align:left;white-space:normal;min-width:170px;}
table.fgd input{width:42px;padding:4px;text-align:center;}
table.fgd tr.avg td{font-weight:700;background:#f2eee1;}

.kriteria-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
table.kriteria{width:100%;border-collapse:collapse;font-size:12.5px;font-family:'Source Sans Pro',Arial,sans-serif;}
table.kriteria th,table.kriteria td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
table.kriteria th{background:#eef1f6;}

.empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-family:'Source Sans Pro',Arial,sans-serif;font-size:13px;}

.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius);
  padding:30px 32px;margin-bottom:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(230,182,86,.12);}
.hero .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:700;font-family:'Source Sans Pro',Arial,sans-serif;}
.hero h2{font-family:Georgia,serif;font-size:26px;margin:8px 0 8px;max-width:640px;}
.hero p{font-size:13.5px;color:#cfd6e3;max-width:560px;font-family:'Source Sans Pro',Arial,sans-serif;}
.stat-row{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:12px 16px;min-width:120px;}
.stat .n{font-family:Georgia,serif;font-size:22px;font-weight:700;}
.stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#c3cbdb;font-family:'Source Sans Pro',Arial,sans-serif;margin-top:2px;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.nav-card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:16px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow);
}
.nav-card:hover{border-color:var(--gold);}
.nav-card .code{font-family:Georgia,serif;font-weight:700;color:var(--gold);font-size:13px;}
.nav-card .t{font-size:13.5px;font-weight:700;margin:4px 0 2px;font-family:'Source Sans Pro',Arial,sans-serif;}
.nav-card .d{font-size:12px;color:var(--muted);font-family:'Source Sans Pro',Arial,sans-serif;}
.nav-card .n{font-size:11px;color:var(--gold);font-weight:700;margin-top:8px;font-family:'Source Sans Pro',Arial,sans-serif;}

@media(max-width:880px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;}
  .info-grid,.record-fields{grid-template-columns:1fr;}
  .content{padding:18px;}
  .topbar{padding:12px 18px;flex-direction:column;align-items:flex-start;}
}
</style>
</head>

/* ================= STATE & PENYIMPANAN ================= */
const STORAGE_KEY = 'kk-manrisk-dpmd-sulteng-2026';
let DATA = null;
let currentForm = 'home';
let saveTimer = null;

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ DATA = JSON.parse(res.value); return; }
  }catch(e){ /* belum ada data tersimpan */ }
  DATA = deepClone(RAW_DATA);
  await persist();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false);
    flashSaved();
  }catch(e){ console.error('Gagal menyimpan', e); }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 500);
}

function flashSaved(){
  const el = document.getElementById('savePill');
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1400);
}

/* ================= UTIL ================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    e.appendChild(typeof c==='string'? document.createTextNode(c) : c);
  });
  return e;
}

function fieldInput(obj, key, opt={}){
  const type = opt.type || 'text';
  const wrap = el('div', {class:'field'+(opt.full?' full':'')});
  wrap.appendChild(el('label',{}, opt.label||key));
  let input;
  if(type==='textarea'){
    input = el('textarea', {rows: opt.rows||2});
    input.value = obj[key] ?? '';
  } else if(type==='number'){
    input = el('input', {type:'number'});
    input.value = obj[key] ?? '';
  } else {
    input = el('input', {type:'text'});
    input.value = obj[key] ?? '';
  }
  input.addEventListener('input', ()=>{
    obj[key] = type==='number' ? (input.value===''? '' : Number(input.value)) : input.value;
    scheduleSave();
    opt.onInput && opt.onInput();
  });
  wrap.appendChild(input);
  if(opt.help) wrap.appendChild(el('div',{class:'help'}, opt.help));
  return wrap;
}

function levelOf(skala){
  const s = Number(skala)||0;
  if(s<=9) return 'rendah';
  if(s<=19) return 'sedang';
  return 'tinggi';
}
function badge(skala){
  const lvl = levelOf(skala);
  const txt = lvl==='rendah'?'Rendah':lvl==='sedang'?'Sedang':'Tinggi';
  return el('span',{class:'badge badge-'+lvl}, txt);
}

    arr.push(blank); scheduleSave(); render();
  }}, '+ Tambah data '+rmeta.itemLabel);

function renderRecordCard(rec, i, arr, rmeta){
  const card = el('details',{class:'record-card'});
  const summary = el('summary',{},[
    el('span',{class:'idx'}, String(rec.no || i+1)),
    el('span',{class:'sum'},[
      el('div',{class:'title'}, truncate(rmeta.titleField(rec), 110)),
      el('div',{class:'meta'}, rmeta.metaField ? rmeta.metaField(rec) : ''),
    ]),
    el('span',{class:'chev'}, '▶'),
  ]);
  const body = el('div',{class:'body'});
  const fgrid = el('div',{class:'record-fields'});
  rmeta.fields.forEach(f=>{
    fgrid.appendChild(fieldInput(rec, f.key, {label:f.label, help:f.help, type:f.type, full: f.full || (f.w && f.w>=3), onInput: ()=>{
      summary.querySelector('.title').textContent = truncate(rmeta.titleField(rec),110);
      if(rmeta.metaField) summary.querySelector('.meta').textContent = rmeta.metaField(rec);
    }}));
  });
  body.appendChild(fgrid);
  const actions = el('div',{class:'record-actions'});
  actions.appendChild(el('button',{class:'btn btn-sm btn-danger', onclick:(e)=>{ e.preventDefault(); arr.splice(i,1); scheduleSave(); render(); }}, 'Hapus data ini'));
  body.appendChild(actions);
  card.appendChild(summary); card.appendChild(body);
  return card;
}

  panel.appendChild(el('div',{class:'desc'}, fgd.judul || ''));
  const listWrap = el('div',{class:'record-list'});
  fgd.peserta.forEach((p,i)=>{
    const row = el('div',{class:'record-fields', style:'grid-template-columns:60px 2fr 1.4fr auto;align-items:center;margin-bottom:6px;'});
    const noI = el('input',{type:'text'}); noI.value = p.no; noI.addEventListener('input',()=>{p.no=noI.value; scheduleSave();});
    const namaI = el('input',{type:'text', placeholder:'Nama peserta'}); namaI.value = p.nama; namaI.addEventListener('input',()=>{p.nama=namaI.value; scheduleSave(); renderFgdTable();});
    const unitI = el('input',{type:'text', placeholder:'Asal unit kerja'}); unitI.value = p.unit; unitI.addEventListener('input',()=>{p.unit=unitI.value; scheduleSave();});
    row.appendChild(noI); row.appendChild(namaI); row.appendChild(unitI);
    row.appendChild(el('button',{class:'btn btn-sm btn-danger', onclick:()=>{ fgd.peserta.splice(i,1); scheduleSave(); render(); }},'Hapus'));
    listWrap.appendChild(row);
  });
  panel.appendChild(listWrap);
  panel.appendChild(el('div',{class:'add-row'}, el('button',{class:'btn btn-sm', onclick:()=>{
    fgd.peserta.push({no:fgd.peserta.length+1, nama:'', unit:'', scores:{}});
    scheduleSave(); render();
  }}, '+ Tambah peserta')));
  container.appendChild(panel);

  const panel2 = el('div',{class:'panel'});
  panel2.appendChild(el('h3',{},'Penilaian Dampak (D) dan Kemungkinan (K) per Risiko'));
  panel2.appendChild(el('div',{class:'desc'},'Isi skala 1–5 untuk tiap risiko menurut penilaian masing-masing peserta. Nilai rata-rata dihitung otomatis dan menjadi acuan pengisian Form 4 (Hasil Analisis Risiko).'));
  const tableWrap = el('div',{class:'fgd-table-wrap', id:'fgdTableWrap'});
  panel2.appendChild(tableWrap);
  container.appendChild(panel2);
  renderFgdTable();
}

function renderFgdTable(){
  const wrap = document.getElementById('fgdTableWrap');
  if(!wrap) return;
  wrap.innerHTML='';
  const fgd = DATA.form4fgd;
  const riskKeys = Object.keys(fgd.risknames);
  const table = el('table',{class:'fgd'});
  const thead1 = el('tr',{}, [el('th',{}, 'Peserta'), ...riskKeys.map(k=>el('th',{colspan:'2'}, k))]);
  const thead2 = el('tr',{}, [el('th',{}, fgd.judul? '' : ''), ...riskKeys.map(()=>[el('th',{},'D'), el('th',{},'K')]).flat()]);
  table.appendChild(thead1); table.appendChild(thead2);

  fgd.peserta.forEach(p=>{
    const tr = el('tr',{});
    tr.appendChild(el('td',{class:'name-col'}, (p.nama||'—') + (p.unit? ' · '+p.unit : '')));
    riskKeys.forEach(k=>{
      if(!p.scores[k]) p.scores[k]={D:'',K:''};
      ['D','K'].forEach(dk=>{
        const td = el('td',{});
        const inp = el('input',{type:'number', min:'1', max:'5'});
        inp.value = p.scores[k][dk] ?? '';
        inp.addEventListener('input', ()=>{ p.scores[k][dk] = inp.value===''?'':Number(inp.value); scheduleSave(); updateFgdAverages(); });
        td.appendChild(inp);
        tr.appendChild(td);
      });
    });
    table.appendChild(tr);
  });

  const trTotal = el('tr',{class:'avg', id:'fgdTotalRow'});
  const trAvg = el('tr',{class:'avg', id:'fgdAvgRow'});
  table.appendChild(trTotal); table.appendChild(trAvg);
  wrap.appendChild(table);
  updateFgdAverages();
}

function updateFgdAverages(){
  const fgd = DATA.form4fgd;
  const riskKeys = Object.keys(fgd.risknames);
  const totalRow = document.getElementById('fgdTotalRow');
  const avgRow = document.getElementById('fgdAvgRow');
  if(!totalRow) return;
  totalRow.innerHTML=''; avgRow.innerHTML='';
  totalRow.appendChild(el('td',{}, 'Jumlah'));
  avgRow.appendChild(el('td',{}, 'Rata-rata'));
  riskKeys.forEach(k=>{
    ['D','K'].forEach(dk=>{
      let sum=0,n=0;
      fgd.peserta.forEach(p=>{ const v=p.scores[k] && p.scores[k][dk]; if(v!==''&&v!==undefined&&v!==null){sum+=Number(v);n++;} });
      totalRow.appendChild(el('td',{}, n? String(sum): '-'));
      avgRow.appendChild(el('td',{}, n? (sum/n).toFixed(1): '-'));
    });
  });
}

/* ================= RENDER: MATRIKS RISIKO (otomatis) ================= */
function renderMatriks(container){
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h3',{},'Matriks Analisis Risiko'));
  panel.appendChild(el('div',{class:'desc'}, FORMS.matriks.desc));

  const records = (DATA.form4hasil && DATA.form4hasil.records) || [];
  const grid = {};
  records.forEach(r=>{
    const d = Number(r.dampak), k = Number(r.kemungkinan);
    if(!d || !k) return;
    const key = k+'-'+d;
    (grid[key] = grid[key]||[]).push({kode:r.kode||'(tanpa kode)', skala:r.skala});
  });

  const dampakLabels = ['Tidak signifikan','Kurang Signifikan','Sedang','Signifikan','Sangat signifikan'];
  const kemungkinanLabels = ['Sangat jarang','Kemungkinan kecil','Kadang-kadang','Kemungkinan besar','Hampir pasti'];

  const table = el('table',{class:'matrix'});
  const head = el('tr',{}, [el('th',{},''), ...dampakLabels.map((l,i)=>el('th',{}, (i+1)+' · '+l))]);
  table.appendChild(head);
  for(let k=5;k>=1;k--){
    const tr = el('tr',{});
    tr.appendChild(el('td',{class:'axis'}, k+' · '+kemungkinanLabels[k-1]));
    for(let d=1; d<=5; d++){
      const items = grid[k+'-'+d] || [];
      const lvl = items.length? levelOf(items[0].skala || (d*k)) : '';
      const td = el('td',{class:'cell'+(lvl?' lvl-'+lvl:'')});
      items.forEach(it=> td.appendChild(el('span',{class:'chip'}, it.kode)));
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  const matrixWrap = el('div',{class:'matrix-wrap'}, table);
  panel.appendChild(matrixWrap);

  const legend = el('div',{style:'margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;'},[
    el('span',{},[badge(5),' Rendah — risiko dapat diterima']),
    el('span',{},[badge(15),' Sedang/Tinggi — perlu penanganan lanjutan']),
    el('span',{},[badge(25),' Sangat Tinggi — penanganan prioritas']),
  ]);
  panel.appendChild(legend);
  container.appendChild(panel);

  const kpanel = el('div',{class:'panel'});
  kpanel.appendChild(el('h3',{},'Kriteria Penilaian (acuan pengisian Form 4)'));
  const kgrid = el('div',{class:'kriteria-grid'});
  const t1 = el('table',{class:'kriteria'});
  t1.appendChild(el('tr',{},[el('th',{},'Nilai'),el('th',{},'Kriteria Kemungkinan')]));
  [[1,'Sangat Jarang'],[2,'Jarang'],[3,'Kadang-Kadang'],[4,'Sering'],[5,'Sangat Sering']].forEach(r=>{
    t1.appendChild(el('tr',{},[el('td',{},String(r[0])),el('td',{},r[1])]));
  });
  const t2 = el('table',{class:'kriteria'});
  t2.appendChild(el('tr',{},[el('th',{},'Nilai'),el('th',{},'Kriteria Dampak')]));
  [[1,'Tidak Signifikan'],[2,'Kurang Signifikan'],[3,'Sedang'],[4,'Signifikan'],[5,'Sangat Signifikan']].forEach(r=>{
    t2.appendChild(el('tr',{},[el('td',{},String(r[0])),el('td',{},r[1])]));
  });
  kgrid.appendChild(t1); kgrid.appendChild(t2);
  kpanel.appendChild(kgrid);
  container.appendChild(kpanel);
}

/* ================= SIGNATURE BLOCK ================= */
function renderSignature(container, formKey){
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h3',{},'Penandatangan'));
  const grid = el('div',{class:'info-grid'});
  const d = DATA[formKey];
  const map = formKey==='form2b'
    ? [['ttdTempatTanggal','Tempat, Tanggal'],['ttdNama','Nama'],['ttdPangkat','Pangkat/Golongan'],['ttdNip','NIP']]
    : [['ttdTempatTanggal','Tempat, Tanggal'],['ttdJabatan','Jabatan'],['ttdNama','Nama'],['ttdPangkat','Pangkat/Golongan'],['ttdNip','NIP']];
  map.forEach(([k,l])=> grid.appendChild(fieldInput(d,k,{label:l, type:'textarea'})));
  panel.appendChild(grid);
  container.appendChild(panel);
}

/* ================= MAIN RENDER ================= */
function render(){
  renderMenu();
  const content = document.getElementById('content');
  content.innerHTML = '';
  const crumb = document.getElementById('crumb');
  const title = document.getElementById('pageTitle');

  if(currentForm==='home'){
    crumb.textContent = 'Ringkasan';
    title.textContent = 'Beranda';
    renderHome(content);
    return;
  }

  const meta = FORMS[currentForm];
  crumb.textContent = 'Form ' + meta.code;
  title.textContent = meta.title;

  if(meta.auto==='matrix'){ renderMatriks(content); return; }
  if(meta.auto==='fgd'){ renderFgd(content); return; }

  if(meta.header) renderHeaderPanel(content, currentForm, meta);
  if(meta.programTree) renderProgramTree(content, currentForm);
  if(meta.lists) renderLists(content, currentForm, meta);
  if(meta.records) renderRecords(content, currentForm, meta);
  if(meta.signature) renderSignature(content, currentForm);
}

/* ================= EKSPOR EXCEL ================= */
function buildSheetForForm(key, meta){
  const rows = [];
  rows.push(['Form '+meta.code+' — '+meta.title]);
  rows.push([]);
  if(meta.header){
    meta.header.forEach(f=>{ rows.push([f.label, DATA[key][f.key]||'']); });
    rows.push([]);
  }
  if(meta.lists){
    meta.lists.forEach(lm=>{
      rows.push([lm.label]);
      const arr = DATA[key][lm.key];
      if(lm.simple){
        arr.forEach((v,i)=> rows.push([i+1, v]));
      } else {
        rows.push(lm.fields.map(f=>f.label));
        arr.forEach(item=> rows.push(lm.fields.map(f=>item[f.key]||'')));
      }
      rows.push([]);
    });
  }
  if(meta.programTree){
    rows.push(['Program / Kegiatan / Sub Kegiatan']);
    DATA[key].programKegiatan.forEach(it=>{
      rows.push([it.level, it.program||'', it.kegiatan||'', it.sub||'']);
    });
    rows.push([]);
  }
  if(meta.records){
    const rmeta = meta.records;
    const headers = rmeta.fields.map(f=>f.label);
    if(rmeta.groupField) headers.unshift(rmeta.groupLabel);
    rows.push(headers);
    DATA[key][rmeta.key].forEach(rec=>{
      const line = rmeta.fields.map(f=> rec[f.key] ?? '');
      if(rmeta.groupField) line.unshift(rec[rmeta.groupField]||'');
      rows.push(line);
    });
  }
  return XLSX.utils.aoa_to_sheet(rows);
}

function buildFgdSheet(){
  const fgd = DATA.form4fgd;
  const riskKeys = Object.keys(fgd.risknames);
  const rows = [];
  rows.push(['Form 4 — Kertas Kerja FGD Analisis Risiko']);
  rows.push([fgd.judul||'']);
  rows.push([]);
  const head1 = ['No','Nama Peserta','Asal Unit'];
  riskKeys.forEach(k=>{ head1.push(k); head1.push(''); });
  rows.push(head1);
  const head2 = ['','',''];
  riskKeys.forEach(()=>{ head2.push('D'); head2.push('K'); });
  rows.push(head2);
  const head3 = ['','',''];
  riskKeys.forEach(k=>{ head3.push(fgd.risknames[k]); head3.push(''); });
  rows.push(head3);
  fgd.peserta.forEach(p=>{
    const line = [p.no, p.nama, p.unit];
    riskKeys.forEach(k=>{
      const s = p.scores[k]||{};
      line.push(s.D ?? ''); line.push(s.K ?? '');
    });
    rows.push(line);
  });
  return XLSX.utils.aoa_to_sheet(rows);
}

function buildMatriksSheet(){
  const rows = [['Matriks Analisis Risiko (dihitung otomatis dari Form 4)']];
  rows.push([]);
  rows.push(['Kemungkinan \\ Dampak','1 - Tidak Signifikan','2 - Kurang Signifikan','3 - Sedang','4 - Signifikan','5 - Sangat Signifikan']);
  const records = (DATA.form4hasil && DATA.form4hasil.records) || [];
  const grid = {};
  records.forEach(r=>{
    const d=Number(r.dampak), k=Number(r.kemungkinan);
    if(!d||!k) return;
    const key=k+'-'+d;
    (grid[key]=grid[key]||[]).push(r.kode||'');
  });
  const kLabels = ['1 - Sangat jarang','2 - Kemungkinan kecil','3 - Kadang-kadang','4 - Kemungkinan besar','5 - Hampir pasti'];
  for(let k=5;k>=1;k--){
    const row = [kLabels[k-1]];
    for(let d=1; d<=5; d++){ row.push((grid[k+'-'+d]||[]).join(', ')); }
    rows.push(row);
  }
  return XLSX.utils.aoa_to_sheet(rows);
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  MENU_ORDER.filter(k=>k!=='home').forEach(key=>{
    const meta = FORMS[key];
    let ws;
    if(meta.auto==='fgd') ws = buildFgdSheet();
    else if(meta.auto==='matrix') ws = buildMatriksSheet();
    else ws = buildSheetForForm(key, meta);
    const sheetName = ('Form '+meta.code+' '+meta.title).slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'-');
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const opdName = (DATA.form2b && DATA.form2b.opd) || 'OPD';
  const fname = 'Kertas Kerja Manajemen Risiko 2026 - '+opdName+'.xlsx';
  XLSX.writeFile(wb, fname);
}

/* ================= IMPOR EXCEL ================= */
function importExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      MENU_ORDER.filter(k=>k!=='home').forEach(key=>{
        const meta = FORMS[key];
        const sheetName = ('Form '+meta.code+' '+meta.title).slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'-');
        const ws = wb.Sheets[sheetName];
        if(!ws) return;
        const aoa = XLSX.utils.sheet_to_json(ws, {header:1, blankrows:true, defval:''});
        importSheetIntoForm(key, meta, aoa);
      });
      scheduleSave();
      render();
      alert('Impor data dari Excel berhasil.');
    }catch(err){
      console.error(err);
      alert('Gagal membaca file Excel. Pastikan file berasal dari hasil ekspor aplikasi ini.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function importSheetIntoForm(key, meta, aoa){
  if(meta.auto==='fgd' || meta.auto==='matrix') return; // dua sheet ini otomatis, tidak diimpor manual
  let r = 2; // baris 0: judul, 1: kosong
  if(meta.header){
    meta.header.forEach(f=>{
      const row = aoa[r]; if(row) DATA[key][f.key] = row[1] ?? '';
      r++;
    });
    r++; // baris kosong
  }
  if(meta.lists){
    meta.lists.forEach(lm=>{
      r++; // judul list
      const arr = [];
      if(lm.simple){
        while(aoa[r] && aoa[r].length && aoa[r][0]!==''){
          arr.push(aoa[r][1] ?? '');
          r++;
        }
      } else {
        r++; // header kolom
        while(aoa[r] && aoa[r].some(c=>c!=='')){
          const item = {};
          lm.fields.forEach((f,i)=> item[f.key] = aoa[r][i] ?? '');
          arr.push(item);
          r++;
        }
      }
      DATA[key][lm.key] = arr;
      r++; // baris kosong
    });
  }
  if(meta.programTree){
    r++; // judul
    const arr = [];
    while(aoa[r] && aoa[r].some(c=>c!=='')){
      arr.push({level:aoa[r][0]||'program', program:aoa[r][1]||'', kegiatan:aoa[r][2]||'', sub:aoa[r][3]||''});
      r++;
    }
    DATA[key].programKegiatan = arr;
    r++;
  }
  if(meta.records){
    const rmeta = meta.records;
    r++; // header row
    const arr = [];
    const offset = rmeta.groupField ? 1 : 0;
    for(let i=r;i<aoa.length;i++){
      const row = aoa[i];
      if(!row || !row.some(c=>c!=='')) continue;
      const item = {};
      if(rmeta.groupField) item[rmeta.groupField] = row[0]||'';
      rmeta.fields.forEach((f,idx)=>{ item[f.key] = row[idx+offset] ?? ''; });
      arr.push(item);
    }
    DATA[key][rmeta.key] = arr;
  }
}

/* ================= INIT ================= */
async function init(){
  await loadData();
  render();
  document.getElementById('btnExport').addEventListener('click', exportExcel);
  document.getElementById('btnReset').addEventListener('click', async ()=>{
    if(confirm('Muat ulang ke data awal Kertas Kerja Manajemen Risiko 2026? Perubahan yang belum diekspor akan hilang.')){
      DATA = deepClone(RAW_DATA);
      await persist();
      render();
    }
  });
  document.getElementById('fileImport').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importExcel(file);
    e.target.value='';
  });
}
init();
</script>
